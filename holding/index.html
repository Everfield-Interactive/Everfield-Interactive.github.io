<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark" />
    <title>Everfield Interactive</title>
    <style>
      /* ink-900 and porcelain-100. The styles stay inline so that the build emits one file. */
      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        background: #141313;
        color: #e9eaeb;
        font-family: ui-serif, Georgia, 'Times New Roman', serif;
        font-size: 0.875rem;
        line-height: 1.55;
      }

      footer {
        padding: clamp(24px, 5vw, 96px);
      }

      p {
        margin: 0;
        text-wrap: balance;
      }
    </style>
  </head>
  <body>
    <footer>
      <p>%OWNERSHIP_NOTICE%</p>
    </footer>
  </body>
</html>
